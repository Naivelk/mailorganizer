name: Organizador de Correo

on:
  schedule:
    - cron: '0 10 * * *'    # 10:00 UTC = 5:00 AM Colombia (listo cuando despiertas)
  workflow_dispatch:          # botón para correrlo manualmente

permissions:
  contents: write             # para guardar state.json (no reprocesar)

concurrency:
  group: mail-organizer-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Organizar correo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MS_CLIENT_ID:       ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN_1: ${{ secrets.MS_REFRESH_TOKEN_1 }}
          MS_REFRESH_TOKEN_2: ${{ secrets.MS_REFRESH_TOKEN_2 }}
        run: python organizer.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main
          git push
